name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc \
          bison \
          flex \
          libssl-dev \
          make \
          gcc \
          g++ \
          clang \
          ccache \
          wget \
          unzip \
          build-essential \
          libelf-dev \
          zlib1g-dev

    - name: Download Clang Toolchain
      run: |
        mkdir -p ~/toolchain
        cd ~/toolchain
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master.tar.gz
        tar -xvf master.tar.gz
        export PATH=$PWD/bin:$PATH

    - name: Build Kernel
      env:
        ARCH: arm64
        SUBARCH: arm64
        CLANG_TRIPLE: aarch64-linux-gnu-
        CROSS_COMPILE: $HOME/toolchain/bin/aarch64-linux-android-
        CROSS_COMPILE_ARM32: $HOME/toolchain/bin/arm-linux-androideabi-
        PATH: $HOME/toolchain/bin:$PATH
      run: |
        mkdir -p out
        make O=out ARCH=arm64 chiron_defconfig
        make -j$(nproc) O=out ARCH=arm64 \
          CC=clang \
          CROSS_COMPILE=$CROSS_COMPILE \
          CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v3
      with:
        name: kernel-image
        path: out/arch/arm64/boot/Image.gz-dtb
